---
name: checks
on:
    pull_request:
        paths:
            - "src/**"
            - "tests/**"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: |
                uv run ruff check
                uv run ruff format --check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: uv run ty check

    vulture:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: uv run vulture --min-confidence 100 --exclude ".venv" .
