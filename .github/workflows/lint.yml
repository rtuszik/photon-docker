---
name: checks
on:
    pull_request:
        paths:
            - "src/**"
            - "tests/**"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: |
                uv run ruff check
                uv run ruff format --check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: uv run ty check

    vulture:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: uv run vulture --min-confidence 100 --exclude ".venv" .
