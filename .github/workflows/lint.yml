---
name: checks
on:
    pull_request:
        paths:
            - "src/**"
            - "tests/**"
            - "pyproject.toml"
            - "uv.lock"
            - ".python-version"
            - ".github/**"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: |
                uv run ruff check
                uv run ruff format --check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: uv run ty check

    vulture:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                python-version-file: ".python-version"

            - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                enable-cache: true
                version: 0.12.3

            - run: uv sync --locked
            - run: uv run vulture --min-confidence 100 --exclude ".venv" .
