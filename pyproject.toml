#:schema https://www.schemastore.org/pyproject.json

[project]
name = "photon-docker"
version = "2.3.1"
description = "Unofficial docker image for the Photon Geocoder"
requires-python = ">=3.12"
dependencies = [
    "apprise>=1.9.3",
    "psutil>=5.9.0",
    "python-dateutil>=2.9.0.post0",
    "requests==2.33.1",
    "schedule>=1.2.2",
    "tqdm==4.67.3",
    "zstandard>=0.23.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "prek>=0.3.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.7",
    "ty>=0.0.1a16",
    "vulture>=2.14",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.lint]
ignore = [
    "ANN",  # flake8-annotations
    "COM",  # flake8-commas
    "DJ",  # django
    "EXE",  # flake8-executable
    "BLE",  # blind except
    "PTH",  # flake8-pathlib
    "T10",  # debugger
    "TID",  # flake8-tidy-imports
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D213",
    "D203",
    "D400",
    "D415",
    "G004",
    "PLR2004",
    "E501",  # line too long
    "TRY",
    "SIM105",  # faster without contextlib
]  # select = ["ALL"]
extend-select = [
    "A",
    "B",
    "S",
    "SIM",
    "T20",
    "C901",
    "RET",
    "ICN",
    "ISC",
    "FA",
    "C4",
    "UP",
    "I",
    "E",
    "W",
    "F",
    "RUF",
    "ASYNC",
    "FAST",
    "FBT",
    "DTZ",
    "LOG",
    "PIE",
    "PYI",
    "PT",
    "ARG",
    "N",
    "PERF",
    "FURB",
]

fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "FBT", "ARG", "PLR"]
# Static region lookup table: positional booleans are the db_available column.
"src/utils/regions.py" = ["FBT001", "FBT003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
skip-magic-trailing-comma = true

[tool.tombi.format.rules]
indent-style = "space"
indent-width = 4

[tool.uv.build-backend]
module-name = "src"
module-root = ""
